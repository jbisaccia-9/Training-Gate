[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "training-gate"
version = "0.1.0"
description = "A vendor-neutral framework for automating document-based compliance training: detect, deliver, acknowledge, remind, and file proof."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
training-gate = "training_gate.cli:main"

[tool.setuptools.packages.find]
include = ["training_gate*"]
