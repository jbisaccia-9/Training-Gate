name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Synthetic end-to-end demo
        run: python -m training_gate demo --out out

  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan for personal or private information
        env:
          # Optional: add a repository secret with comma-separated private terms
          # (employer, client, vendor, or system names) to block them in CI too.
          PII_DENYLIST: ${{ secrets.PII_DENYLIST }}
        run: python scripts/pii_scan.py
